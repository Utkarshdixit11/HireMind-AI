<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HireMind AI — Where careers rise through the silence. AI-powered resume analysis, job matching, and talent discovery." />
    <title>HireMind AI — Hire Smarter. Grow Faster.</title>

    <!-- Google Fonts: Instrument Serif + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js"></script>

    <!-- Tailwind CDN with custom config -->
    <script>
      window.tailwind = { config: {
        theme: {
          extend: {
            colors: {
              background: 'hsl(201 100% 13%)',
              foreground: 'hsl(0 0% 100%)',
              'muted-fg': 'hsl(240 4% 66%)',
              primary: 'hsl(0 0% 100%)',
              secondary: 'hsl(0 0% 10%)',
              border: 'hsl(0 0% 18%)',
            },
            fontFamily: {
              display: ["'Instrument Serif'", 'serif'],
              body: ["'Inter'", 'sans-serif'],
            },
          }
        }
      }};
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
